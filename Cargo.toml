[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Preston Brown"]
license = "MIT"

[workspace.dependencies]
lark-span = { path = "crates/lark-span" }
lark-diag = { path = "crates/lark-diag" }
lark-syntax = { path = "crates/lark-syntax" }
lark-cpp = { path = "crates/lark-cpp" }
lark-resolve = { path = "crates/lark-resolve" }
lark-types = { path = "crates/lark-types" }
lark-mono = { path = "crates/lark-mono" }
lark-codegen = { path = "crates/lark-codegen" }
lark-driver = { path = "crates/lark-driver" }
lark-fmt = { path = "crates/lark-fmt" }
lark-lsp = { path = "crates/lark-lsp" }
lark-cache = { path = "crates/lark-cache" }
lark-pkg = { path = "crates/lark-pkg" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
# Allowed with a reason. See docs/decisions.md D041.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
